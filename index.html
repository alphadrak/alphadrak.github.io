    function mettreAJourHorloge() {
        const maintenant = new Date();
        // Affichage des heures et minutes uniquement (HH:MM)
        document.getElementById('horloge').textContent = maintenant.toLocaleTimeString('fr-FR', {
            hour: '2-digit',
            minute: '2-digit'
        });
        
        const optionsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date-du-jour').textContent = maintenant.toLocaleDateString('fr-FR', optionsDate);
    }
    setInterval(mettreAJourHorloge, 1000);
    mettreAJourHorloge();

    // --- DÉTECTION ET AFFICHAGE DES ICÔNES ---
    function genererIconeHtml(lien) {
        try {
            const parsedUrl = new URL(lien.url);
            const isLocal = parsedUrl.hostname.startsWith('192.168.') || parsedUrl.hostname === 'localhost';
            const isDirectFile = parsedUrl.pathname.endsWith('.exe') || parsedUrl.pathname.endsWith('.zip');

            // Pour les adresses IP ou les téléchargements directs d'exécutables, on utilise l'icône FontAwesome
            if (isLocal || isDirectFile) {
                return `<i class="${lien.iconSecours}"></i>`;
            }

            // Sinon on charge la Favicon Google avec une icône de secours transparente au cas où
            const faviconUrl = `https://www.google.com/s2/favicons?domain=${parsedUrl.hostname}&sz=64`;
            return `<img src="${faviconUrl}" alt="" class="favicon" onerror="this.replaceWith(document.createRange().createContextualFragment('<i class=\\'${lien.iconSecours}\\'></i>'))">`;
        } catch (e) {
            return `<i class="${lien.iconSecours}"></i>`;
        }
    }

    // --- RENDU DES CARTES ---

            return;

            const iconHtml = genererIconeHtml(lien);

                <a href="${lien.url}" target="_blank" class="carte-lien">
                    <div>
                        <div class="carte-header">
                            <div class="icon-container">
                                ${iconHtml}
                            </div>

                    <div class="carte-footer">
                        <span class="tag-categorie">${lien.categorie}</span>
                        <span>Ouvrir <span class="arrow">&rarr;</span></span>
                    </div>
                </a>
            `;
        }).join('');
    }

    // --- FILTRES ET RECHERCHE ---
    function filtrerCategorie(cat) {
        categorieActive = cat;
        document.querySelectorAll('.btn-categorie').forEach(btn => {
            btn.classList.toggle('active', btn.textContent.toLowerCase().includes(cat) || (cat === 'tous' && btn.textContent === 'Tous'));

            return correspondCategorie && correspondRecherche;
        });

        afficherLiens(resultats);
    }

    document.getElementById('recherche').addEventListener('input', appliquerFiltres);

    // Premier affichage

<html lang="fr">
<head>

            flex-direction: column;
            justify-content: space-between;

            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);

        .carte-lien:hover {
            transform: translateY(-50px);

            align-items: center;
            gap: 12px;

        }

        .icon-container {

            height: 36px;
            border-radius: 10px;

        .carte-titre {

</head>
