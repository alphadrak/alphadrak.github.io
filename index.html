<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Dashboard Personnel</title>

    <!-- Google Fonts & FontAwesome pour les icônes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 32, 51, 0.65);
            --card-hover-bg: rgba(34, 48, 74, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.15) 0px, transparent 40%),
                radial-gradient(at 90% 90%, rgba(129, 140, 248, 0.15) 0px, transparent 40%),
                radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.05) 0px, transparent 60%);
            background-attachment: fixed;
            color: var(--text-main);
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px 60px 20px;
            min-height: 100vh;
        }

        /* --- HEADER & HORLOGE --- */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 35px;
            text-align: center;
        }

        .horloge {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .date-du-jour {
            color: var(--accent-color);
            font-size: 0.95rem;
            font-weight: 500;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
        }

        /* --- CONTENEUR RECHERCHE & BOUTON CODE --- */
        .header-controls {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 650px;
            margin-bottom: 25px;
            align-items: center;
        }

        .search-container {
            position: relative;
            flex: 1;
        }

        .search-container i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .search-bar {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .search-bar:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-notes {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: var(--accent-color);
            padding: 14px 20px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .btn-notes:hover {
            background: var(--accent-color);
            color: #0b0f19;
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        /* --- FILTRES DE CATÉGORIES --- */
        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn-categorie {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-categorie:hover, .btn-categorie.active {
            background: var(--accent-color);
            color: #0b0f19;
            border-color: var(--accent-color);
            font-weight: 600;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* --- GRILLE DE CARTES --- */
        .grille-liens {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .carte-lien {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .carte-lien:hover {
            transform: translateY(-4px);
            background: var(--card-hover-bg);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-glow);
        }

        .carte-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .icon-container {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--accent-color);
            flex-shrink: 0;
            padding: 5px;
        }

        .favicon {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .carte-titre {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .carte-description {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 18px;
        }

        .carte-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-top: auto;
        }

        .tag-categorie {
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
        }

        .carte-footer span.arrow {
            transition: transform 0.2s ease;
        }

        .carte-lien:hover .carte-footer span.arrow {
            transform: translateX(4px);
        }

        /* --- MODAL BLOC-NOTES MULTI-ONGLETS --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 8, 15, 0.8);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            width: 90%;
            max-width: 850px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.15);
            overflow: hidden;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.8);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .modal-title i {
            color: var(--accent-color);
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #ef4444;
        }

        /* BARRE D'ONGLETS TYPE NAVIGATEUR */
        .tabs-bar {
            display: flex;
            align-items: center;
            background: #090d16;
            border-bottom: 1px solid var(--border-color);
            padding: 8px 12px 0 12px;
            gap: 6px;
            overflow-x: auto;
        }

        .tab-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-bottom: none;
            padding: 8px 14px;
            border-radius: 8px 8px 0 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            max-width: 180px;
        }

        .tab-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        .tab-item.active {
            background: #1e293b;
            color: var(--accent-color);
            border-color: rgba(56, 189, 248, 0.4);
            font-weight: 600;
        }

        .tab-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            outline: none;
        }

        .tab-close {
            font-size: 0.8rem;
            opacity: 0.6;
            border-radius: 50%;
            padding: 2px 4px;
            transition: all 0.2s;
        }

        .tab-close:hover {
            opacity: 1;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .btn-add-tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 10px;
            cursor: pointer;
            font-size: 1rem;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .btn-add-tab:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-color);
        }

        .modal-body {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            background: #0b1120;
        }

        .code-textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: #e2e8f0;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            outline: none;
            resize: none;
        }

        .modal-footer {
            padding: 12px 20px;
            background: rgba(30, 41, 59, 0.5);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .save-indicator {
            font-size: 0.8rem;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .save-indicator.visible {
            opacity: 1;
        }

        .btn-copy {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-copy:hover {
            background: var(--accent-color);
            color: #0b0f19;
        }
    </style>
</head>
<body>

    <header>
        <div class="horloge" id="horloge">00:00</div>
        <div class="date-du-jour" id="date-du-jour">Chargement...</div>

        <div class="header-controls">
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="recherche" class="search-bar" placeholder="Chercher un raccourci... (Appuyez sur Entrée pour ouvrir)" autocomplete="off">
            </div>
            <button class="btn-notes" onclick="ouvrirModalNotes()">
                <i class="fa-solid fa-code"></i>
                <span>Code & Notes</span>
            </button>
        </div>

        <div class="categories" id="conteneur-categories">
            <button class="btn-categorie active" onclick="filtrerCategorie('tous')">Tous</button>
            <button class="btn-categorie" onclick="filtrerCategorie('gaming')">Gaming</button>
            <button class="btn-categorie" onclick="filtrerCategorie('systeme')">Système & NAS</button>
            <button class="btn-categorie" onclick="filtrerCategorie('outils')">Outils & IA</button>
            <button class="btn-categorie" onclick="filtrerCategorie('navigateurs')">Navigateurs</button>
        </div>
    </header>

    <main id="conteneur-liens" class="grille-liens"></main>

    <!-- MODAL BLOC-NOTES MULTI-ONGLETS -->
    <div class="modal-overlay" id="modal-notes" onclick="fermerModalSurFond(event)">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title">
                    <i class="fa-solid fa-terminal"></i>
                    <span>Éditeur de Snippets & Notes</span>
                </div>
                <button class="modal-close" onclick="fermerModalNotes()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- BARRE D'ONGLETS -->
            <div class="tabs-bar" id="tabs-container">
                <!-- Les onglets sont générés dynamiquement par JS -->
                <button class="btn-add-tab" onclick="ajouterOnglet()" title="Nouvel onglet"><i class="fa-solid fa-plus"></i></button>
            </div>

            <div class="modal-body">
                <textarea id="zone-code" class="code-textarea" placeholder="Collez votre code, commandes terminal, ou notes ici..." spellcheck="false"></textarea>
            </div>

            <div class="modal-footer">
                <div class="save-indicator" id="save-indicator">
                    <i class="fa-solid fa-circle-check"></i> Sauvegardé automatiquement
                </div>
                <button class="btn-copy" onclick="copierCode()">
                    <i class="fa-solid fa-copy"></i>
                    <span>Copier l'onglet actif</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // LISTE DE TES LIENS
        const liens = [
            {
                nom: "Tous les pilotes",
                description: "Pilotes PC & Drivers",
                url: "https://fichiers2.touslesdrivers.com/Mes_Drivers_3.0.4.exe",
                categorie: "systeme",
                iconSecours: "fa-solid fa-microchip"
            },
            {
                nom: "Steam",
                description: "Installer la plateforme Steam",
                url: "https://cdn.fastly.steamstatic.com/client/installer/SteamSetup.exe",
                categorie: "gaming",
                customLogo: "https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg",
                iconSecours: "fa-brands fa-steam"
            },
            {
                nom: "VALORANT",
                description: "Installer le jeu VALORANT",
                url: "https://valorant.secure.dyn.riotcdn.net/channels/public/x/installer/current/live.live.eu.exe",
                categorie: "gaming",
                customLogo: "https://upload.wikimedia.org/wikipedia/commons/f/fc/Valorant_logo_-_submark.svg",
                iconSecours: "fa-solid fa-gamepad"
            },
            {
                nom: "Roblox",
                description: "Installer le client Roblox",
                url: "https://www.roblox.com/download/client?os=win&renderingPlatform=nextjs",
                categorie: "gaming",
                customLogo: "https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_2022.svg",
                iconSecours: "fa-solid fa-cube"
            },
            {
                nom: "SkidrowReloaded",
                description: "Jeux PC",
                url: "https://www.skidrowreloaded.com/",
                categorie: "gaming",
                iconSecours: "fa-solid fa-skull-crossbones"
            },
            {
                nom: "Valorant Guessr",
                description: "Mini-jeu de devinettes Valo",
                url: "https://vlr-guessr.pages.dev/",
                categorie: "gaming",
                iconSecours: "fa-solid fa-crosshairs"
            },
            {
                nom: "Neal.Fun",
                description: "Expériences & mini-jeux interactifs",
                url: "https://neal.fun/",
                categorie: "gaming",
                iconSecours: "fa-solid fa-wand-magic-sparkles"
            },
            {
                nom: "WeMod",
                description: "Application de mods et cheats pour jeux solo",
                url: "https://www.wemod.com/fr/download",
                categorie: "gaming",
                customLogo: "https://www.wemod.com/favicon.ico",
                iconSecours: "fa-solid fa-wand-magic"
            },
            {
                nom: "Terramaster NAS",
                description: "Interface de gestion locale du NAS",
                url: "https://192.168.1.71:1624/tos/#/desktop",
                categorie: "systeme",
                iconSecours: "fa-solid fa-server"
            },
            {
                nom: "Gemini",
                description: "Assistant IA Google",
                url: "https://gemini.google.com/app",
                categorie: "outils",
                customLogo: "https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg",
                iconSecours: "fa-solid fa-gemini"
            },
            {
                nom: "ChatGPT",
                description: "Assistant IA OpenAI",
                url: "https://chatgpt.com",
                categorie: "outils",
                customLogo: "https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg",
                iconSecours: "fa-solid fa-robot"
            },
            {
                nom: "Spotify",
                description: "Installer l'application de streaming musical",
                url: "https://download.scdn.co/SpotifySetup.exe",
                categorie: "outils",
                customLogo: "https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg",
                iconSecours: "fa-brands fa-spotify"
            },
            {
                nom: "Discord",
                description: "Installer l'application de discussion vocale et textuelle",
                url: "https://discord.com/api/download?platform=win",
                categorie: "outils",
                customLogo: "https://upload.wikimedia.org/wikipedia/fr/4/4f/Discord_Logo_sans_texte.svg",
                iconSecours: "fa-brands fa-discord"
            },
            {
                nom: "Mozilla Firefox",
                description: "Installer le navigateur rapide et respectueux de la vie privée",
                url: "https://download.mozilla.org/?product=firefox-stub&os=win&lang=fr",
                categorie: "navigateurs",
                customLogo: "https://upload.wikimedia.org/wikipedia/commons/a/a0/Firefox_logo%2C_2019.svg",
                iconSecours: "fa-brands fa-firefox-browser"
            },
            {
                nom: "Google Chrome",
                description: "Installer le navigateur rapide de Google",
                url: "https://dl.google.com/tag/s/appguid%3D%7B8A69D345-D564-463C-AFF1-A69D9E530F96%7D%26iid%3D%7BEB5A9C53-83A5-42E1-BF0B-E2A93A60EE91%7D%26lang%3Dfr%26browser%3D4%26usagestats%3D1%26appname%3DGoogle%2520Chrome%26needsadmin%3Dprefers%26ap%3Dx64-stats-def_1%26installdataindex%3Dempty/update2/installers/ChromeSetup.exe",
                categorie: "navigateurs",
                customLogo: "https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg",
                iconSecours: "fa-brands fa-chrome"
            }
        ];

        let categorieActive = 'tous';
        let resultatsActuels = [...liens];

        // --- HORLOGE ---
        function mettreAJourHorloge() {
            const maintenant = new Date();
            document.getElementById('horloge').textContent = maintenant.toLocaleTimeString('fr-FR', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            const optionsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date-du-jour').textContent = maintenant.toLocaleDateString('fr-FR', optionsDate);
        }
        setInterval(mettreAJourHorloge, 1000);
        mettreAJourHorloge();

        // --- ICÔNES ---
        function genererIconeHtml(lien) {
            if (lien.customLogo) {
                return `<img src="${lien.customLogo}" alt="${lien.nom}" class="favicon" onerror="this.outerHTML='<i class=\\'${lien.iconSecours}\\'></i>'">`;
            }

            try {
                const parsedUrl = new URL(lien.url);
                const isLocal = parsedUrl.hostname.startsWith('192.168.') || parsedUrl.hostname === 'localhost';
                const isDirectFile = parsedUrl.pathname.endsWith('.exe') || parsedUrl.pathname.endsWith('.zip') || parsedUrl.pathname.includes('download');

                if (isLocal || isDirectFile) {
                    return `<i class="${lien.iconSecours}"></i>`;
                }

                const faviconUrl = `https://www.google.com/s2/favicons?domain=${parsedUrl.hostname}&sz=64`;
                return `<img src="${faviconUrl}" alt="" class="favicon" onerror="this.outerHTML='<i class=\\'${lien.iconSecours}\\'></i>'">`;
            } catch (e) {
                return `<i class="${lien.iconSecours}"></i>`;
            }
        }

        // --- RENDU DES CARTES ---
        function afficherLiens(liste) {
            const conteneur = document.getElementById("conteneur-liens");
            
            if(liste.length === 0) {
                conteneur.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); margin-top: 20px;">Aucun raccourci ne correspond à votre recherche.</p>`;
                return;
            }

            conteneur.innerHTML = liste.map(lien => {
                const iconHtml = genererIconeHtml(lien);

                return `
                    <a href="${lien.url}" target="_blank" class="carte-lien">
                        <div>
                            <div class="carte-header">
                                <div class="icon-container">
                                    ${iconHtml}
                                </div>
                                <h2 class="carte-titre">${lien.nom}</h2>
                            </div>
                            <p class="carte-description">${lien.description}</p>
                        </div>
                        <div class="carte-footer">
                            <span class="tag-categorie">${lien.categorie}</span>
                            <span>Ouvrir <span class="arrow">&rarr;</span></span>
                        </div>
                    </a>
                `;
            }).join('');
        }

        // --- FILTRES ET RECHERCHE ---
        function filtrerCategorie(cat) {
            categorieActive = cat;
            document.querySelectorAll('.btn-categorie').forEach(btn => {
                const btnTxt = btn.textContent.toLowerCase();
                if (cat === 'tous') {
                    btn.classList.toggle('active', btnTxt === 'tous');
                } else {
                    btn.classList.toggle('active', btnTxt.includes(cat));
                }
            });
            appliquerFiltres();
        }

        function appliquerFiltres() {
            const recherche = document.getElementById('recherche').value.toLowerCase().trim();
            
            resultatsActuels = liens.filter(lien => {
                const correspondCategorie = categorieActive === 'tous' || lien.categorie === categorieActive;
                const correspondRecherche = lien.nom.toLowerCase().includes(recherche) || lien.description.toLowerCase().includes(recherche);
                return correspondCategorie && correspondRecherche;
            });

            afficherLiens(resultatsActuels);
        }

        const inputRecherche = document.getElementById('recherche');
        inputRecherche.addEventListener('input', appliquerFiltres);
        inputRecherche.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && resultatsActuels.length > 0) {
                window.open(resultatsActuels[0].url, '_blank');
            }
        });

        // --- GESTION DES ONGLETS DU BLOC-NOTES ---
        let onglets = JSON.parse(localStorage.getItem('dashboard_onglets')) || [
            { id: 1, titre: "Code & Commandes", contenu: "// Collez vos lignes de code ou notes ici\n" }
        ];
        let ongletActifId = Number(localStorage.getItem('dashboard_onglet_actif')) || 1;
        let saveTimeout;

        function sauvegarderDonnees() {
            localStorage.setItem('dashboard_onglets', JSON.stringify(onglets));
            localStorage.setItem('dashboard_onglet_actif', ongletActifId);

            const indicator = document.getElementById('save-indicator');
            indicator.classList.add('visible');
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                indicator.classList.remove('visible');
            }, 1500);
        }

        function rendreOnglets() {
            const container = document.getElementById('tabs-container');
            const btnAdd = container.querySelector('.btn-add-tab');

            // Supprimer les anciens onglets
            container.querySelectorAll('.tab-item').forEach(el => el.remove());

            onglets.forEach(onglet => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab-item ${onglet.id === ongletActifId ? 'active' : ''}`;
                tabEl.onclick = () => changerOnglet(onglet.id);

                tabEl.innerHTML = `
                    <span class="tab-title" contenteditable="true" onblur="renommerOnglet(${onglet.id}, this.textContent)" onkeydown="intercepterEntree(event)">${onglet.titre}</span>
                    ${onglets.length > 1 ? `<i class="fa-solid fa-xmark tab-close" onclick="supprimerOnglet(event, ${onglet.id})"></i>` : ''}
                `;
                container.insertBefore(tabEl, btnAdd);
            });

            // Mettre à jour la zone de texte
            const ongletCourant = onglets.find(o => o.id === ongletActifId) || onglets[0];
            document.getElementById('zone-code').value = ongletCourant ? ongletCourant.contenu : '';
        }

        function changerOnglet(id) {
            ongletActifId = id;
            rendreOnglets();
            sauvegarderDonnees();
        }

        function ajouterOnglet() {
            const nouvelId = Date.now();
            onglets.push({
                id: nouvelId,
                titre: `Onglet ${onglets.length + 1}`,
                contenu: ""
            });
            ongletActifId = nouvelId;
            rendreOnglets();
            sauvegarderDonnees();
        }

        function supprimerOnglet(e, id) {
            e.stopPropagation();
            if (onglets.length <= 1) return;

            onglets = onglets.filter(o => o.id !== id);
            if (ongletActifId === id) {
                ongletActifId = onglets[0].id;
            }
            rendreOnglets();
            sauvegarderDonnees();
        }

        function renommerOnglet(id, nouveauTitre) {
            const onglet = onglets.find(o => o.id === id);
            if (onglet && nouveauTitre.trim() !== '') {
                onglet.titre = nouveauTitre.trim();
                sauvegarderDonnees();
            }
        }

        function intercepterEntree(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                e.target.blur();
            }
        }

        // Écoute des modifications dans la zone de texte
        document.getElementById('zone-code').addEventListener('input', (e) => {
            const onglet = onglets.find(o => o.id === ongletActifId);
            if (onglet) {
                onglet.contenu = e.target.value;
                sauvegarderDonnees();
            }
        });

        // --- GESTION DU MODAL ---
        function ouvrirModalNotes() {
            rendreOnglets();
            document.getElementById('modal-notes').classList.add('active');
        }

        function fermerModalNotes() {
            document.getElementById('modal-notes').classList.remove('active');
        }

        function fermerModalSurFond(e) {
            if (e.target.classList.contains('modal-overlay')) {
                fermerModalNotes();
            }
        }

        function copierCode() {
            const textarea = document.getElementById('zone-code');
            navigator.clipboard.writeText(textarea.value).then(() => {
                const btn = document.querySelector('.btn-copy span');
                const origTxt = btn.textContent;
                btn.textContent = "Copié !";
                setTimeout(() => btn.textContent = origTxt, 2000);
            });
        }

        // FERMETURE PAR TOUCHE ECHAP
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') fermerModalNotes();
        });

        // CHARGEMENT INITIAL
        appliquerFiltres();
    </script>
</body>
</html>
